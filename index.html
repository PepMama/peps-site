<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPS - Page d'accueil</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="main-container">
        <!-- Première ligne links -->
        <div class="row-top">
            <!-- Lien ADN -->
            <a href="#" class="link">
                <img class="link-img" src="assets/images/adn.jpg" alt="ADN">
                <span class="link-text">ADN</span>
            </a>

            <!-- Lien Accompagnement -->
            <a href="#" class="link">
                <img class="link-img" src="assets/images/accompagnements.jpg" alt="Nos accompagnements">
                <span class="link-text">Nos accompagnements</span>
            </a>
        </div>
        <!-- Fin de première ligne links-->

        <!-- Logo central -->
        <div class="logo-center">
            <img src="assets/images/LOGO/COULEUR/logo-complet.png" alt="Logo PEPS">
        </div>


        <!-- Deuxième ligne links -->
        <div class="row-bottom">
            <!--Lien Veille-->
            <a href="#" class="link img-bottom">
                <img class="link-img" src="assets/images/veille.jpg" alt="Nous nous tenons en veille">
                <span class="link-text">Nous nous tenons en veille</span>
            </a>

            <!-- Lien Concrètement -->
            <a href="#" class="link img-bottom">
                <img class="link-img" src="assets/images/how.jpg" alt="Concrètement comment ?">
                <span class="link-text">Concrètement comment ?</span>
            </a>

            <!-- Lien Contact -->
            <a href="#" class="link img-bottom">
                <img class="link-img" src="assets/images/contact.jpg" alt="Ça te tente ?">
                <span class="link-text">Ça te tente ?</span>
            </a>
        </div>
        <!-- Deuxième ligne links -->

    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
